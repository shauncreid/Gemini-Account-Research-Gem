name: Validate YAML

on:
  push:
    branches: [ "**" ]
    paths:
      - "**.yml"
      - "**.yaml"
  pull_request:
    branches: [ "**" ]
    paths:
      - "**.yml"
      - "**.yaml"

jobs:
  yaml-lint:
    name: Lint YAML files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -f colored .
